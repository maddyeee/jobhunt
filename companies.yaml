# Workday endpoints — full URLs to the CxS jobs API
# Format: https://<sub>.myworkdayjobs.com/wday/cxs/<tenant>/<site>/jobs
#
# VERIFIED WORKING (probed 2026-08-13): Intel, NVIDIA, Micron, Marvell, Analog Devices, NXP
#
# BROKEN (422/404) — commented out until URLs are updated. Fix instructions:
#   1. Open the company's public careers page in Chrome
#   2. Open DevTools -> Network -> filter for "jobs"
#   3. Click Search on the careers page
#   4. Copy the POST URL from Network (looks like .../wday/cxs/<tenant>/<site>/jobs)
#   5. Paste it below and uncomment the entry
workday:
  - name: Intel
    url: https://intel.wd1.myworkdayjobs.com/wday/cxs/intel/External/jobs
  - name: NVIDIA
    url: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
  - name: Micron
    url: https://micron.wd1.myworkdayjobs.com/wday/cxs/micron/External/jobs
  - name: Marvell
    url: https://marvell.wd1.myworkdayjobs.com/wday/cxs/marvell/MarvellCareers2/jobs
  - name: Analog Devices
    url: https://analogdevices.wd1.myworkdayjobs.com/wday/cxs/analogdevices/External/jobs
  - name: NXP
    url: https://nxp.wd3.myworkdayjobs.com/wday/cxs/nxp/careers/jobs

