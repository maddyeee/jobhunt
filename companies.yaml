  # AMD        → iCIMS → dedicated amd_icims.py fetcher (always runs, no key needed)
  # Broadcom   → SAP SuccessFactors (unconfirmed) → aggregator_targets below
  # TI         → Oracle Talent Mgmt → aggregator_targets below
  # Microchip  → ATS TBD → aggregator_targets below
  # Renesas    → Workday (wrong slug) → aggregator_targets below
  # Infineon   → ATS TBD → aggregator_targets below

# Companies covered via aggregators (JSearch + SerpAPI).
# These are bot-protected portals, custom APIs, or unconfirmed ATS that can't
# be scraped directly. Adding a company here causes a targeted search like
# "Apple ASIC RTL verification engineer" to run through both aggregators.
#
# SerpAPI budget:  100 searches/month free  (~3/day for daily runs)
# JSearch budget:  200 requests/month free  (~6/day for daily runs)
#
# Load split: JSearch handles generic keyword queries;
#             SerpAPI handles company-targeted queries below.
# If you add many companies here, consider upgrading to a paid tier.
aggregator_targets:
  - Apple
  - Google
  - Qualcomm
  - Broadcom
  - Texas Instruments
  - Microchip Technology
  - Renesas
  - Infineon
  - Samsung Semiconductor
  - MediaTek
  - Arm
  - Cadence
  - Synopsys
  - Lattice Semiconductor
  - Skyworks
  - Qorvo
  - Silicon Labs
